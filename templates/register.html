<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS &amp; CO | Create Account</title>
    <meta name="description" content="Register for an RS &amp; CO client account to place RMC orders and track deliveries.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/rmc.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #050505;
            font-family: 'Montserrat', sans-serif;
            display: flex; align-items: center; justify-content: center;
            overflow-x: hidden;
        }

        .auth-bg {
            position: fixed; inset: 0; z-index: 0;
            background: url('/static/images/rmc_plant_trucks.jpg') center/cover no-repeat;
            animation: bgZoom 20s ease-in-out infinite alternate;
        }
        @keyframes bgZoom { from{transform:scale(1)} to{transform:scale(1.08)} }
        .auth-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: linear-gradient(135deg,
                rgba(5,5,5,0.90) 0%,
                rgba(0,0,0,0.75) 50%,
                rgba(10,5,0,0.92) 100%);
        }

        .auth-wrap {
            position: relative; z-index: 2;
            width: 100%; max-width: 520px;
            padding: 16px;
            margin: 24px auto;
        }

        .auth-card {
            background: rgba(15,15,15,0.93);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 12px;
            padding: 40px 40px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(212,175,55,0.05);
            backdrop-filter: blur(20px);
            animation: cardIn .5s cubic-bezier(.16,1,.3,1);
        }
        @keyframes cardIn { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

        .auth-logo-row {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 24px;
        }
        .auth-logo { height: 52px; }
        .auth-brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem; color: #fff; font-weight: 700;
        }
        .auth-brand-tag {
            font-size: 0.6rem; color: #D4AF37;
            letter-spacing: 2px; text-transform: uppercase; display: block;
        }

        .auth-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem; font-weight: 700; color: #fff;
            margin-bottom: 4px;
        }
        .auth-subtitle { color: #777; font-size: 0.86rem; margin-bottom: 28px; }

        /* Two-column grid for name + phone */
        .field-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }
        @media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }

        .field-group { margin-bottom: 18px; position: relative; }
        .field-group label {
            display: block; font-size: 0.76rem; font-weight: 600;
            color: #D4AF37; text-transform: uppercase; letter-spacing: 1.2px;
            margin-bottom: 7px;
        }
        .field-group input {
            width: 100%; padding: 12px 42px 12px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(212,175,55,0.25);
            border-radius: 6px; color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88rem; transition: border-color .25s, box-shadow .25s;
            min-height: 46px;
        }
        .field-group input:focus {
            outline: none; border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212,175,55,.12);
        }
        .field-group input::placeholder { color: #444; }
        .field-group input.invalid { border-color: #dc3545; }
        .field-group input.valid   { border-color: #28a745; }

        .pw-toggle {
            position: absolute; right: 12px; top: 36px;
            background: none; border: none; cursor: pointer;
            color: #555; font-size: 15px; padding: 4px; transition: color .2s;
        }
        .pw-toggle:hover { color: #D4AF37; }

        /* password strength bar */
        .pw-strength-wrap { margin-top: 6px; }
        .pw-strength-bar {
            height: 3px; background: #222; border-radius: 2px; overflow: hidden;
        }
        .pw-strength-fill {
            height: 100%; width: 0%; border-radius: 2px;
            transition: width .3s, background .3s;
        }
        .pw-strength-label { font-size: 0.7rem; color: #666; margin-top: 4px; }

        .btn-auth {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #D4AF37 0%, #af9063 100%);
            color: #1a1a1a; border: none; border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: all .25s;
            position: relative; overflow: hidden;
            margin-top: 6px; min-height: 50px;
        }
        .btn-auth::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
            transform: translateX(-100%); transition: .5s;
        }
        .btn-auth:hover::after { transform: translateX(100%); }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212,175,55,.35); }
        .btn-auth:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        .auth-alert {
            padding: 12px 16px; border-radius: 6px;
            font-size: 0.83rem; margin-bottom: 16px;
            display: none; align-items: center; gap: 10px;
        }
        .auth-alert.error   { background: rgba(220,53,69,.14);  border:1px solid rgba(220,53,69,.4);  color:#ff6b7a; display:flex; }
        .auth-alert.success { background: rgba(40,167,69,.14);  border:1px solid rgba(40,167,69,.4);  color:#5cdb80; display:flex; }

        .auth-footer { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.06); }
        .auth-footer p { font-size: 0.83rem; color: #666; margin-bottom: 8px; text-align: center; }
        .auth-footer a { color: #D4AF37; text-decoration: none; font-weight: 600; transition: color .2s; }
        .auth-footer a:hover { color: #e5c158; }

        .auth-back {
            display: inline-flex; align-items: center; gap: 6px;
            color: #555; font-size: 0.8rem; text-decoration: none;
            margin-bottom: 20px; transition: color .2s;
        }
        .auth-back:hover { color: #D4AF37; }

        .terms-note { font-size: 0.74rem; color: #555; text-align: center; margin-top: 10px; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(0,0,0,.3);
            border-top-color: #1a1a1a;
            border-radius: 50%; animation: spin .7s linear infinite;
            display: inline-block; vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .auth-card { padding: 28px 18px; }
            .auth-title { font-size: 1.55rem; }
        }
    </style>
</head>
<body>
    <div class="auth-bg"></div>
    <div class="auth-overlay"></div>

    <div class="auth-wrap">
        <a href="/" class="auth-back">&#8592; Back to Main Website</a>

        <div class="auth-card">
            <div class="auth-logo-row">
                <img src="/static/images/logo.png" alt="RS&CO" class="auth-logo">
                <div>
                    <span class="auth-brand-name">R SUNDARAM &amp; CO</span>
                    <span class="auth-brand-tag">Strong Roads Build To Last</span>
                </div>
            </div>

            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Register as a client to place RMC orders, track deliveries &amp; download invoices</p>

            <div id="auth-alert" class="auth-alert"></div>

            <form id="register-form" autocomplete="on" novalidate>

                <div class="field-row">
                    <div class="field-group">
                        <label for="reg-fullname">Full Name *</label>
                        <input type="text" id="reg-fullname" name="full_name"
                               placeholder="S Maghesh" required autocomplete="name">
                    </div>
                    <div class="field-group">
                        <label for="reg-phone">Phone Number</label>
                        <input type="tel" id="reg-phone" name="phone"
                               placeholder="+91 9876543210" autocomplete="tel">
                    </div>
                </div>

                <div class="field-group">
                    <label for="reg-username">Username *</label>
                    <input type="text" id="reg-username" name="username"
                           placeholder="Choose a unique username" required autocomplete="username">
                </div>

                <div class="field-group">
                    <label for="reg-email">Email Address *</label>
                    <input type="email" id="reg-email" name="email"
                           placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="field-group">
                    <label for="reg-password">Password *</label>
                    <input type="password" id="reg-password" name="password"
                           placeholder="Min 8 characters" required autocomplete="new-password"
                           minlength="8">
                    <button type="button" class="pw-toggle" id="pw-toggle1" aria-label="Toggle">&#128065;</button>
                    <div class="pw-strength-wrap">
                        <div class="pw-strength-bar">
                            <div class="pw-strength-fill" id="pw-fill"></div>
                        </div>
                        <div class="pw-strength-label" id="pw-label"></div>
                    </div>
                </div>

                <div class="field-group">
                    <label for="reg-confirm">Confirm Password *</label>
                    <input type="password" id="reg-confirm" name="confirm_password"
                           placeholder="Re-enter your password" required autocomplete="new-password">
                    <button type="button" class="pw-toggle" id="pw-toggle2" aria-label="Toggle">&#128065;</button>
                </div>

                <button type="submit" class="btn-auth" id="register-btn">Create My Account</button>
                <p class="terms-note">By registering you agree to our terms of service and privacy policy.</p>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Sign In &rarr;</a></p>
                <p><a href="/">&#127968; Return to Main Website</a></p>
            </div>
        </div>
    </div>

    <script>
        // ── Password toggles ──────────────────────────────────────────
        function initToggle(btnId, inputId) {
            document.getElementById(btnId).addEventListener('click', () => {
                const inp = document.getElementById(inputId);
                const btn = document.getElementById(btnId);
                inp.type = inp.type === 'password' ? 'text' : 'password';
                btn.innerHTML = inp.type === 'password' ? '&#128065;' : '&#128064;';
            });
        }
        initToggle('pw-toggle1', 'reg-password');
        initToggle('pw-toggle2', 'reg-confirm');

        // ── Password strength meter ───────────────────────────────────
        document.getElementById('reg-password').addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            if (val.length >= 8)  score++;
            if (val.length >= 12) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;

            const fill  = document.getElementById('pw-fill');
            const label = document.getElementById('pw-label');
            const levels = [
                { pct:'20%', color:'#dc3545', text:'Very Weak' },
                { pct:'40%', color:'#fd7e14', text:'Weak' },
                { pct:'60%', color:'#ffc107', text:'Fair' },
                { pct:'80%', color:'#20c997', text:'Strong' },
                { pct:'100%',color:'#28a745', text:'Very Strong' },
            ];
            const lv = levels[Math.max(0, score - 1)] || levels[0];
            fill.style.width    = val ? lv.pct   : '0%';
            fill.style.background = val ? lv.color  : '';
            label.style.color   = val ? lv.color  : '#666';
            label.textContent   = val ? lv.text   : '';
        });

        // ── Real-time confirm match ───────────────────────────────────
        document.getElementById('reg-confirm').addEventListener('input', function() {
            const pw  = document.getElementById('reg-password').value;
            const cfg = this.value;
            this.className = '';
            if (cfg.length > 0) {
                this.classList.add(cfg === pw ? 'valid' : 'invalid');
            }
        });

        // ── Registration submit ───────────────────────────────────────
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const full_name = document.getElementById('reg-fullname').value.trim();
            const username  = document.getElementById('reg-username').value.trim();
            const email     = document.getElementById('reg-email').value.trim();
            const phone     = document.getElementById('reg-phone').value.trim();
            const password  = document.getElementById('reg-password').value;
            const confirm   = document.getElementById('reg-confirm').value;

            // Client-side validation
            if (!full_name || !username || !email || !password) {
                showAlert('Please fill in all required fields.', 'error'); return;
            }
            if (password.length < 8) {
                showAlert('Password must be at least 8 characters.', 'error'); return;
            }
            if (password !== confirm) {
                showAlert('Passwords do not match. Please re-enter.', 'error'); return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showAlert('Please enter a valid email address.', 'error'); return;
            }

            const btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Creating account…';
            document.getElementById('auth-alert').className = 'auth-alert';
            document.getElementById('auth-alert').style.display = 'none';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, username, email, phone, password })
                });
                const data = await res.json();

                if (data.success) {
                    showAlert('🎉 Account created successfully! Taking you to login…', 'success');
                    setTimeout(() => window.location.href = '/login', 1800);
                } else {
                    showAlert(data.error || 'Registration failed. Please try again.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'Create My Account';
                }
            } catch (err) {
                showAlert('Connection error. Please check your connection and try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Create My Account';
            }
        });

        function showAlert(msg, type) {
            const el = document.getElementById('auth-alert');
            el.textContent = msg;
            el.className = 'auth-alert ' + type;
        }
    </script>
</body>
</html>
