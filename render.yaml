services:
  - type: web
    name: rsandco-website
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers=2 --timeout=120 --bind=0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    disk:
      name: rsandco-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
